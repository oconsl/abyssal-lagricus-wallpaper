<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Abyssal Lagiacrus Wallpaper</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Electrolize&display=swap");

            :root {
                --bg-image: url("abyssal-lagricus.png");
                --cyan: 111, 232, 255;
                --blue: 42, 147, 255;
                --white: 220, 247, 255;
                --text: rgba(235, 249, 255, 0.96);
                --text-soft: rgba(214, 236, 246, 0.78);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #03111d;
                font-family: "Electrolize", system-ui, sans-serif;
            }

            body {
                position: relative;
                color: var(--text);
                user-select: none;
            }

            .wallpaper {
                position: relative;
                width: 100vw;
                height: 100vh;
                overflow: hidden;
                isolation: isolate;
                background:
                    radial-gradient(
                        circle at 20% 18%,
                        rgba(115, 223, 255, 0.16),
                        transparent 32%
                    ),
                    radial-gradient(
                        circle at 78% 26%,
                        rgba(58, 130, 255, 0.15),
                        transparent 30%
                    ),
                    radial-gradient(
                        circle at 55% 75%,
                        rgba(6, 44, 77, 0.55),
                        transparent 40%
                    ),
                    linear-gradient(
                        180deg,
                        rgba(2, 18, 31, 0.12),
                        rgba(0, 10, 20, 0.64)
                    ),
                    var(--bg-image) center center / cover no-repeat;
                transform: scale(1.03);
                animation: slowDrift 28s ease-in-out infinite alternate;
            }

            .wallpaper::before,
            .wallpaper::after {
                content: "";
                position: absolute;
                inset: -8%;
                pointer-events: none;
                z-index: 0;
            }

            .wallpaper::before {
                background:
                    radial-gradient(
                        circle at 20% 10%,
                        rgba(166, 240, 255, 0.18),
                        transparent 24%
                    ),
                    radial-gradient(
                        circle at 80% 12%,
                        rgba(85, 173, 255, 0.12),
                        transparent 26%
                    ),
                    linear-gradient(
                        180deg,
                        rgba(150, 225, 255, 0.1),
                        transparent 28%,
                        rgba(0, 0, 0, 0.22) 100%
                    );
                mix-blend-mode: screen;
                filter: blur(8px);
                animation: causticBreath 12s ease-in-out infinite;
            }

            .wallpaper::after {
                background:
                    radial-gradient(
                        circle at center,
                        transparent 38%,
                        rgba(0, 4, 10, 0.18) 68%,
                        rgba(0, 3, 8, 0.78) 100%
                    ),
                    repeating-radial-gradient(
                        circle at 50% 50%,
                        rgba(255, 255, 255, 0.012) 0 1px,
                        transparent 1px 6px
                    );
                opacity: 0.95;
                z-index: 9;
            }

            .depth-haze,
            .water-rays,
            .mist,
            .vignette,
            .grain {
                position: absolute;
                inset: 0;
                pointer-events: none;
            }

            .depth-haze {
                z-index: 1;
                background:
                    linear-gradient(
                        180deg,
                        rgba(72, 170, 216, 0.1),
                        rgba(3, 20, 34, 0.05) 38%,
                        rgba(0, 8, 16, 0.36) 100%
                    ),
                    radial-gradient(
                        circle at 50% 44%,
                        transparent 8%,
                        rgba(0, 31, 54, 0.18) 58%,
                        rgba(0, 5, 12, 0.58) 100%
                    );
                backdrop-filter: blur(0.4px);
            }

            .water-rays {
                z-index: 2;
                mix-blend-mode: screen;
                background:
                    linear-gradient(
                        116deg,
                        transparent 10%,
                        rgba(166, 239, 255, 0.12) 28%,
                        transparent 41%
                    ),
                    linear-gradient(
                        102deg,
                        transparent 24%,
                        rgba(112, 208, 255, 0.09) 40%,
                        transparent 55%
                    ),
                    linear-gradient(
                        84deg,
                        transparent 36%,
                        rgba(106, 211, 255, 0.08) 48%,
                        transparent 62%
                    );
                transform-origin: top center;
                animation: raysMove 16s ease-in-out infinite alternate;
            }

            .mist {
                z-index: 3;
                filter: blur(26px);
                background:
                    radial-gradient(
                        circle at 22% 68%,
                        rgba(79, 188, 229, 0.18),
                        transparent 24%
                    ),
                    radial-gradient(
                        circle at 67% 42%,
                        rgba(43, 146, 255, 0.14),
                        transparent 22%
                    ),
                    radial-gradient(
                        circle at 82% 82%,
                        rgba(104, 221, 255, 0.12),
                        transparent 26%
                    );
                animation: mistFloat 20s ease-in-out infinite alternate;
            }

            .vignette {
                z-index: 10;
            }

            .grain {
                z-index: 11;
                mix-blend-mode: soft-light;
                background-image:
                    radial-gradient(
                        rgba(255, 255, 255, 0.85) 0.7px,
                        transparent 0.9px
                    ),
                    radial-gradient(
                        rgba(255, 255, 255, 0.55) 0.6px,
                        transparent 0.8px
                    );
                background-size:
                    5px 5px,
                    7px 7px;
                background-position:
                    0 0,
                    2px 3px;
                animation: grainShift 0.18s steps(2) infinite;
            }

            .particles,
            .bubbles,
            .micro-glow {
                position: absolute;
                inset: 0;
                pointer-events: none;
                overflow: hidden;
            }

            .particles {
                z-index: 4;
            }

            .particle {
                position: absolute;
                width: var(--size);
                height: var(--size);
                border-radius: 50%;
                background: rgba(var(--white), var(--alpha));
                box-shadow:
                    0 0 10px rgba(var(--cyan), calc(var(--alpha) * 0.65)),
                    0 0 20px rgba(var(--blue), calc(var(--alpha) * 0.35));
                filter: blur(0.2px);
                animation: particleDrift var(--duration) linear infinite;
                animation-delay: var(--delay);
                opacity: 0;
            }

            .bubbles {
                z-index: 5;
            }

            .bubble {
                position: absolute;
                bottom: -12vh;
                width: var(--size);
                height: var(--size);
                border-radius: 50%;
                border: 1px solid rgba(214, 246, 255, 0.34);
                background:
                    radial-gradient(
                        circle at 28% 26%,
                        rgba(255, 255, 255, 0.68),
                        rgba(255, 255, 255, 0.11) 16%,
                        transparent 35%
                    ),
                    radial-gradient(
                        circle at 50% 55%,
                        rgba(131, 226, 255, 0.15),
                        transparent 72%
                    );
                box-shadow:
                    inset -2px -2px 8px rgba(255, 255, 255, 0.08),
                    0 0 16px rgba(var(--cyan), 0.1);
                opacity: 0;
                filter: blur(var(--blur));
                animation: bubbleRise var(--duration) ease-in infinite;
                animation-delay: var(--delay);
            }

            .micro-glow {
                z-index: 6;
                mix-blend-mode: screen;
                background:
                    radial-gradient(
                        circle at 39% 34%,
                        rgba(91, 224, 255, 0.2),
                        transparent 10%
                    ),
                    radial-gradient(
                        circle at 57% 44%,
                        rgba(23, 153, 255, 0.12),
                        transparent 12%
                    ),
                    radial-gradient(
                        circle at 48% 58%,
                        rgba(97, 234, 255, 0.09),
                        transparent 11%
                    );
                animation: glowPulse 5.5s ease-in-out infinite;
            }

            .three-lightning {
                position: absolute;
                inset: 0;
                z-index: 7;
                width: 100%;
                height: 100%;
                pointer-events: none;
                mix-blend-mode: screen;
            }

            .water-ripple-canvas {
                position: absolute;
                inset: 0;
                z-index: 13;
                width: 100%;
                height: 100%;
                pointer-events: none;
                mix-blend-mode: overlay;
            }

            .lightning-ambient {
                position: absolute;
                inset: 0;
                z-index: 6;
                pointer-events: none;
                mix-blend-mode: screen;
                opacity: 0;
                transition: opacity 0.05s ease-out;
                background: radial-gradient(
                    ellipse at 50% 40%,
                    rgba(60, 140, 255, 0.12),
                    transparent 60%
                );
            }

            .clock-panel {
                position: absolute;
                z-index: 12;
                padding: 0;
                border: none;
                border-radius: 0;
                background: none;
                box-shadow: none;
                backdrop-filter: none;
            }

            .clock {
                font-family: "Orbitron", monospace, sans-serif;
                line-height: 0.95;
                font-weight: 800;
                letter-spacing: 0.02em;
            }

            .date {
                margin-top: 8px;
                font-family: "Electrolize", system-ui, sans-serif;
                font-weight: 400;
                letter-spacing: 0.28em;
                text-transform: uppercase;
            }

            .clock-accent {
                position: relative;
                width: 48px;
                height: 2px;
                margin-bottom: 12px;
                border-radius: 999px;
            }

            @keyframes slowDrift {
                0% {
                    transform: scale(1.03) translate3d(0, 0, 0);
                }
                100% {
                    transform: scale(1.07) translate3d(-0.7vw, -0.5vh, 0);
                }
            }
            @keyframes causticBreath {
                0%,
                100% {
                    opacity: 0.82;
                    transform: scale(1) translate3d(0, 0, 0);
                }
                50% {
                    opacity: 1;
                    transform: scale(1.04) translate3d(0.8vw, -0.4vh, 0);
                }
            }
            @keyframes raysMove {
                0% {
                    transform: translateX(-1vw) skewX(-3deg);
                    opacity: 0.4;
                }
                100% {
                    transform: translateX(2vw) skewX(2deg);
                    opacity: 0.68;
                }
            }
            @keyframes mistFloat {
                0% {
                    transform: translate3d(-1vw, 0.8vh, 0) scale(1);
                }
                100% {
                    transform: translate3d(1.5vw, -1vh, 0) scale(1.06);
                }
            }
            @keyframes glowPulse {
                0%,
                100% {
                    opacity: 0.65;
                    transform: scale(1);
                }
                50% {
                    opacity: 1;
                    transform: scale(1.02);
                }
            }
            @keyframes particleDrift {
                0% {
                    transform: translate3d(0, 14vh, 0) scale(0.8);
                    opacity: 0;
                }
                12% {
                    opacity: 0.85;
                }
                88% {
                    opacity: 0.5;
                }
                100% {
                    transform: translate3d(var(--drift), -118vh, 0) scale(1.15);
                    opacity: 0;
                }
            }
            @keyframes bubbleRise {
                0% {
                    transform: translate3d(0, 0, 0) scale(0.72);
                    opacity: 0;
                }
                8% {
                    opacity: 0.72;
                }
                84% {
                    opacity: 0.48;
                }
                100% {
                    transform: translate3d(var(--drift), -124vh, 0) scale(1.18);
                    opacity: 0;
                }
            }
            @keyframes grainShift {
                0% {
                    transform: translate(0, 0);
                }
                25% {
                    transform: translate(-1%, 1%);
                }
                50% {
                    transform: translate(1%, -1%);
                }
                75% {
                    transform: translate(0.5%, 1%);
                }
                100% {
                    transform: translate(0, 0);
                }
            }
        </style>
    </head>
    <body>
        <main class="wallpaper" id="wallpaper">
            <div class="depth-haze"></div>
            <div class="water-rays" id="waterRays"></div>
            <div class="mist" id="mist"></div>
            <div class="particles" id="particles"></div>
            <div class="bubbles" id="bubbles"></div>
            <div class="micro-glow"></div>
            <div class="lightning-ambient" id="lightningAmbient"></div>
            <canvas
                class="three-lightning"
                id="threeLightning"
                aria-hidden="true"
            ></canvas>
            <div class="vignette" id="vignette"></div>
            <div class="grain" id="grain"></div>
            <canvas
                class="water-ripple-canvas"
                id="waterRipple"
                aria-hidden="true"
            ></canvas>

            <section
                class="clock-panel"
                id="clockPanel"
                aria-label="Clock and date"
            >
                <span class="clock-accent" id="clockAccent"></span>
                <div class="clock" id="clock">00:00</div>
                <div class="date" id="date">MONDAY, JANUARY 01</div>
            </section>
        </main>

        <script type="module">
            import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

            /* ══════════════════════════════════════════════════════
       CONFIGURATION — all values editable from Wallpaper Engine
       ══════════════════════════════════════════════════════ */
            const CFG = {
                // Clock
                showClock: true,
                clockHour12: false,
                clockColor: [200, 225, 255],
                clockGlowIntensity: 0.6,
                dateColor: [140, 185, 255],
                clockPosX: 12, // vw
                clockPosY: 10, // vh
                clockSize: 85, // percent scale
                showAccentLine: true,

                // Lightning
                lightningEnabled: true,
                lightningBrightness: 0.62,
                lightningCoreColor: [0.82, 0.91, 1.0],
                lightningGlowColor: [0.3, 0.65, 1.0],
                spawnMin: 0.6, // seconds
                spawnMax: 1.8,
                boltLifeMin: 0.18,
                boltLifeMax: 0.48,
                boltJaggedness: 0.5, // 0-1 normalized
                branchEnabled: true,
                crawlEnabled: true,
                flashEnabled: true,
                flashBrightness: 0.35,
                burstChance: 0.15, // 0-1

                // Screen Shake
                shakeEnabled: true,
                shakeIntensity: 0.5, // 0-1 normalized
                shakeIntervalMin: 4,
                shakeIntervalMax: 12,

                // Particles
                particleCount: 90,
                bubbleCount: 28,

                // Effects
                rippleEnabled: true,
                rippleOpacity: 0.13,
                rippleSpeed: 0.5, // multiplier
                grainEnabled: true,
                grainOpacity: 0.07,
                vignetteEnabled: true,
                vignetteIntensity: 0.78,
                mistOpacity: 0.48,
                waterRaysOpacity: 0.58,
            };

            /* ── Wallpaper Engine property listener ── */
            function weColor(val) {
                const c = val
                    .split(" ")
                    .map((v) => Math.ceil(parseFloat(v) * 255));
                return c;
            }
            function weColorNorm(val) {
                return val.split(" ").map((v) => parseFloat(v));
            }

            window.wallpaperPropertyListener = {
                applyUserProperties: function (props) {
                    // Clock
                    if (props.show_clock)
                        CFG.showClock = props.show_clock.value;
                    if (props.clock_hour12)
                        CFG.clockHour12 = props.clock_hour12.value;
                    if (props.clock_color)
                        CFG.clockColor = weColor(props.clock_color.value);
                    if (props.clock_glow_intensity)
                        CFG.clockGlowIntensity =
                            props.clock_glow_intensity.value / 100;
                    if (props.date_color)
                        CFG.dateColor = weColor(props.date_color.value);
                    if (props.clock_pos_x)
                        CFG.clockPosX = props.clock_pos_x.value;
                    if (props.clock_pos_y)
                        CFG.clockPosY = props.clock_pos_y.value;
                    if (props.clock_size)
                        CFG.clockSize = props.clock_size.value;
                    if (props.show_accent_line)
                        CFG.showAccentLine = props.show_accent_line.value;

                    // Lightning
                    if (props.lightning_enabled)
                        CFG.lightningEnabled = props.lightning_enabled.value;
                    if (props.lightning_brightness)
                        CFG.lightningBrightness =
                            props.lightning_brightness.value / 100;
                    if (props.lightning_color)
                        CFG.lightningCoreColor = weColorNorm(
                            props.lightning_color.value,
                        );
                    if (props.lightning_glow_color)
                        CFG.lightningGlowColor = weColorNorm(
                            props.lightning_glow_color.value,
                        );
                    if (props.spawn_min)
                        CFG.spawnMin = props.spawn_min.value / 1000;
                    if (props.spawn_max)
                        CFG.spawnMax = props.spawn_max.value / 1000;
                    if (props.bolt_life_min)
                        CFG.boltLifeMin = props.bolt_life_min.value / 1000;
                    if (props.bolt_life_max)
                        CFG.boltLifeMax = props.bolt_life_max.value / 1000;
                    if (props.bolt_jaggedness)
                        CFG.boltJaggedness = props.bolt_jaggedness.value / 100;
                    if (props.branch_enabled)
                        CFG.branchEnabled = props.branch_enabled.value;
                    if (props.crawl_enabled)
                        CFG.crawlEnabled = props.crawl_enabled.value;
                    if (props.flash_enabled)
                        CFG.flashEnabled = props.flash_enabled.value;
                    if (props.flash_brightness)
                        CFG.flashBrightness =
                            props.flash_brightness.value / 100;
                    if (props.burst_chance)
                        CFG.burstChance = props.burst_chance.value / 100;

                    // Shake
                    if (props.shake_enabled)
                        CFG.shakeEnabled = props.shake_enabled.value;
                    if (props.shake_intensity)
                        CFG.shakeIntensity = props.shake_intensity.value / 100;
                    if (props.shake_interval_min)
                        CFG.shakeIntervalMin = props.shake_interval_min.value;
                    if (props.shake_interval_max)
                        CFG.shakeIntervalMax = props.shake_interval_max.value;

                    // Particles (requires rebuild)
                    if (props.particle_count) {
                        CFG.particleCount = props.particle_count.value;
                        rebuildParticles();
                    }
                    if (props.bubble_count) {
                        CFG.bubbleCount = props.bubble_count.value;
                        rebuildBubbles();
                    }

                    // Effects
                    if (props.ripple_enabled)
                        CFG.rippleEnabled = props.ripple_enabled.value;
                    if (props.ripple_opacity)
                        CFG.rippleOpacity = props.ripple_opacity.value / 100;
                    if (props.ripple_speed)
                        CFG.rippleSpeed = props.ripple_speed.value / 100;
                    if (props.grain_enabled)
                        CFG.grainEnabled = props.grain_enabled.value;
                    if (props.grain_opacity)
                        CFG.grainOpacity = props.grain_opacity.value / 100;
                    if (props.vignette_enabled)
                        CFG.vignetteEnabled = props.vignette_enabled.value;
                    if (props.vignette_intensity)
                        CFG.vignetteIntensity =
                            props.vignette_intensity.value / 100;
                    if (props.mist_opacity)
                        CFG.mistOpacity = props.mist_opacity.value / 100;
                    if (props.water_rays_opacity)
                        CFG.waterRaysOpacity =
                            props.water_rays_opacity.value / 100;

                    // Background image
                    if (
                        props.background_image &&
                        props.background_image.value
                    ) {
                        document.getElementById(
                            "wallpaper",
                        ).style.backgroundImage =
                            `radial-gradient(circle at 20% 18%, rgba(115,223,255,0.16), transparent 32%),
             radial-gradient(circle at 78% 26%, rgba(58,130,255,0.15), transparent 30%),
             radial-gradient(circle at 55% 75%, rgba(6,44,77,0.55), transparent 40%),
             linear-gradient(180deg, rgba(2,18,31,0.12), rgba(0,10,20,0.64)),
             url('file:///${props.background_image.value}')`;
                        document.getElementById(
                            "wallpaper",
                        ).style.backgroundSize = "cover";
                        document.getElementById(
                            "wallpaper",
                        ).style.backgroundPosition = "center";
                    }

                    applyCSS();
                    applyLightningColors();
                },
            };

            /* ── DOM refs ── */
            const particlesRoot = document.getElementById("particles");
            const bubblesRoot = document.getElementById("bubbles");
            const canvas = document.getElementById("threeLightning");
            const clockEl = document.getElementById("clock");
            const dateEl = document.getElementById("date");
            const ambientEl = document.getElementById("lightningAmbient");
            const clockPanel = document.getElementById("clockPanel");
            const clockAccent = document.getElementById("clockAccent");
            const vignetteEl = document.getElementById("vignette");
            const grainEl = document.getElementById("grain");
            const mistEl = document.getElementById("mist");
            const waterRaysEl = document.getElementById("waterRays");
            const rippleCanvas = document.getElementById("waterRipple");

            const rand = (a, b) => Math.random() * (b - a) + a;

            /* ── Apply CSS from CFG ── */
            function applyCSS() {
                // Clock visibility & position
                clockPanel.style.display = CFG.showClock ? "block" : "none";
                clockPanel.style.left = CFG.clockPosX + "vw";
                clockPanel.style.bottom = CFG.clockPosY + "vh";

                const sz = CFG.clockSize / 100;
                clockEl.style.fontSize = `clamp(${Math.round(54 * sz)}px, ${(8.5 * sz).toFixed(1)}vw, ${Math.round(138 * sz)}px)`;

                const cc = CFG.clockColor;
                const gi = CFG.clockGlowIntensity;
                clockEl.style.color = `rgba(${cc[0]},${cc[1]},${cc[2]},0.95)`;
                clockEl.style.textShadow = `
        0 0 8px rgba(${cc[0]},${cc[1]},${cc[2]},${(0.6 * gi).toFixed(2)}),
        0 0 24px rgba(${cc[0]},${cc[1]},${cc[2]},${(0.35 * gi).toFixed(2)}),
        0 0 60px rgba(${cc[0]},${cc[1]},${cc[2]},${(0.15 * gi).toFixed(2)}),
        0 4px 20px rgba(0,0,0,0.5)`;

                const dc = CFG.dateColor;
                dateEl.style.color = `rgba(${dc[0]},${dc[1]},${dc[2]},0.7)`;
                dateEl.style.textShadow = `0 0 12px rgba(${dc[0]},${dc[1]},${dc[2]},0.3), 0 2px 10px rgba(0,0,0,0.4)`;
                dateEl.style.fontSize = `clamp(${Math.round(13 * sz)}px, ${(1.3 * sz).toFixed(1)}vw, ${Math.round(20 * sz)}px)`;

                // Accent line
                clockAccent.style.display =
                    CFG.showAccentLine && CFG.showClock ? "block" : "none";
                clockAccent.style.background = `linear-gradient(90deg, rgba(${cc[0]},${cc[1]},${cc[2]},0.9), rgba(${cc[0]},${cc[1]},${cc[2]},0.05))`;
                clockAccent.style.boxShadow = `0 0 14px rgba(${cc[0]},${cc[1]},${cc[2]},0.5)`;

                // Lightning canvas
                canvas.style.opacity = CFG.lightningEnabled
                    ? CFG.lightningBrightness
                    : 0;

                // Effects
                rippleCanvas.style.opacity = CFG.rippleEnabled
                    ? CFG.rippleOpacity
                    : 0;
                grainEl.style.opacity = CFG.grainEnabled ? CFG.grainOpacity : 0;
                vignetteEl.style.display = CFG.vignetteEnabled
                    ? "block"
                    : "none";
                vignetteEl.style.background = `radial-gradient(circle at 52% 44%, transparent 25%, rgba(0,6,14,0.28) 70%, rgba(0,4,10,${CFG.vignetteIntensity.toFixed(2)}) 100%)`;
                mistEl.style.opacity = CFG.mistOpacity;
                waterRaysEl.style.opacity = CFG.waterRaysOpacity;
            }

            /* ── Apply lightning colors to THREE objects ── */
            function applyLightningColors() {
                const lc = CFG.lightningCoreColor;
                const gc = CFG.lightningGlowColor;
                COL.core.setRGB(lc[0], lc[1], lc[2]);
                COL.inner.setRGB(lc[0] * 0.75, lc[1] * 0.82, lc[2]);
                COL.mid.setRGB(gc[0] * 1.2, gc[1] * 1.1, gc[2]);
                COL.outer.setRGB(gc[0] * 0.6, gc[1] * 0.7, gc[2] * 0.85);
                COL.branch.setRGB(lc[0] * 0.7, lc[1] * 0.78, lc[2]);
                COL.crawl.setRGB(gc[0] * 1.5, gc[1] * 1.2, gc[2]);
                glowQuadMat.uniforms.uFlashColor.value.setRGB(
                    gc[0],
                    gc[1],
                    gc[2],
                );
            }

            /* ── Particles & Bubbles ── */
            function buildItems(root, className, count, setupFn) {
                root.innerHTML = "";
                const f = document.createDocumentFragment();
                for (let i = 0; i < count; i++) {
                    const n = document.createElement("span");
                    n.className = className;
                    setupFn(n);
                    f.appendChild(n);
                }
                root.appendChild(f);
            }

            function rebuildParticles() {
                buildItems(
                    particlesRoot,
                    "particle",
                    CFG.particleCount,
                    (n) => {
                        n.style.left = `${rand(0, 100).toFixed(2)}%`;
                        n.style.top = `${rand(0, 100).toFixed(2)}%`;
                        n.style.setProperty(
                            "--size",
                            `${rand(1, 4.5).toFixed(2)}px`,
                        );
                        n.style.setProperty(
                            "--duration",
                            `${rand(10, 26).toFixed(2)}s`,
                        );
                        n.style.setProperty(
                            "--delay",
                            `${rand(-26, 0).toFixed(2)}s`,
                        );
                        n.style.setProperty(
                            "--drift",
                            `${rand(-10, 10).toFixed(2)}vw`,
                        );
                        n.style.setProperty(
                            "--alpha",
                            rand(0.18, 0.72).toFixed(2),
                        );
                    },
                );
            }

            function rebuildBubbles() {
                buildItems(bubblesRoot, "bubble", CFG.bubbleCount, (n) => {
                    n.style.left = `${rand(0, 100).toFixed(2)}%`;
                    n.style.setProperty(
                        "--size",
                        `${rand(4, 20).toFixed(2)}px`,
                    );
                    n.style.setProperty(
                        "--duration",
                        `${rand(11, 25).toFixed(2)}s`,
                    );
                    n.style.setProperty(
                        "--delay",
                        `${rand(-25, 0).toFixed(2)}s`,
                    );
                    n.style.setProperty(
                        "--drift",
                        `${rand(-7, 7).toFixed(2)}vw`,
                    );
                    n.style.setProperty(
                        "--blur",
                        `${rand(0, 1.2).toFixed(2)}px`,
                    );
                });
            }

            function updateTime() {
                const now = new Date();
                clockEl.textContent = now.toLocaleTimeString("en-US", {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: CFG.clockHour12,
                });
                dateEl.textContent = now
                    .toLocaleDateString("en-US", {
                        weekday: "long",
                        month: "long",
                        day: "2-digit",
                    })
                    .toUpperCase();
            }

            rebuildParticles();
            rebuildBubbles();
            updateTime();
            setInterval(updateTime, 1000);

            /* ══════════════════════════════════════════════════════
       LIGHTNING SYSTEM
       ══════════════════════════════════════════════════════ */

            const renderer = new THREE.WebGLRenderer({
                canvas,
                alpha: true,
                antialias: false,
                powerPreference: "high-performance",
            });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setClearColor(0x000000, 0);

            const scene = new THREE.Scene();
            const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
            camera.position.z = 2;

            const lightningGroup = new THREE.Group();
            scene.add(lightningGroup);

            /* ── Fullscreen glow quad ── */
            const glowQuadGeo = new THREE.PlaneGeometry(2.4, 2.4);
            const glowQuadMat = new THREE.ShaderMaterial({
                transparent: true,
                depthWrite: false,
                depthTest: false,
                blending: THREE.AdditiveBlending,
                uniforms: {
                    uFlashIntensity: { value: 0 },
                    uFlashCenter: { value: new THREE.Vector2(0, 0) },
                    uFlashColor: { value: new THREE.Color(0.3, 0.65, 1.0) },
                    uAspect: { value: window.innerWidth / window.innerHeight },
                },
                vertexShader: `
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
      `,
                fragmentShader: `
        uniform float uFlashIntensity; uniform vec2 uFlashCenter; uniform vec3 uFlashColor; uniform float uAspect;
        varying vec2 vUv;
        void main() {
          vec2 p = vUv*2.0-1.0; vec2 d = p - uFlashCenter; d.x *= uAspect;
          float dist = length(d);
          float a = (exp(-dist*dist*3.5) + exp(-dist*dist*0.8)*0.2) * uFlashIntensity;
          if (a < 0.002) discard;
          gl_FragColor = vec4(uFlashColor, a);
        }
      `,
            });
            const glowQuad = new THREE.Mesh(glowQuadGeo, glowQuadMat);
            glowQuad.position.z = -0.1;
            lightningGroup.add(glowQuad);

            /* ── Colors (mutable, updated by applyLightningColors) ── */
            const COL = {
                core: new THREE.Color(0xd0e8ff),
                inner: new THREE.Color(0x6aafff),
                mid: new THREE.Color(0x3b8def),
                outer: new THREE.Color(0x1a56b8),
                branch: new THREE.Color(0x5da0ff),
                crawl: new THREE.Color(0x4a98ff),
            };

            /* ── Bolt spawn zones ── */
            const ZONES = [
                { x: -0.5, y: 0.3, sx: 0.2, sy: 0.16, sc: 0.7, weight: 0.8 },
                { x: -0.18, y: 0.05, sx: 0.22, sy: 0.2, sc: 1.0, weight: 1.5 },
                { x: 0.12, y: 0.22, sx: 0.24, sy: 0.22, sc: 1.15, weight: 1.8 },
                { x: 0.38, y: -0.04, sx: 0.2, sy: 0.18, sc: 0.95, weight: 1.2 },
                { x: 0.58, y: 0.3, sx: 0.18, sy: 0.14, sc: 0.72, weight: 0.7 },
                { x: 0.0, y: -0.2, sx: 0.3, sy: 0.12, sc: 0.85, weight: 0.6 },
            ];

            function weightedZone() {
                const total = ZONES.reduce((s, z) => s + z.weight, 0);
                let r = Math.random() * total;
                for (const z of ZONES) {
                    r -= z.weight;
                    if (r <= 0) return z;
                }
                return ZONES[0];
            }

            /* ── Fractal path ── */
            function fractalPath(x0, y0, x1, y1, depth, jag, pts) {
                if (depth <= 0) {
                    pts.push(new THREE.Vector3(x1, y1, 0));
                    return;
                }
                const mx = (x0 + x1) / 2 + (Math.random() - 0.5) * jag;
                const my = (y0 + y1) / 2 + (Math.random() - 0.5) * jag * 0.6;
                fractalPath(x0, y0, mx, my, depth - 1, jag * 0.58, pts);
                fractalPath(mx, my, x1, y1, depth - 1, jag * 0.58, pts);
            }

            function createPath(zone) {
                const sx = zone.x + rand(-zone.sx, zone.sx),
                    sy = zone.y + rand(-zone.sy, zone.sy);
                const height = rand(0.22, 0.65) * zone.sc,
                    dir = Math.random() > 0.5 ? 1 : -1;
                const ex = sx + rand(0.04, 0.22) * dir,
                    ey = sy - height;
                const jag = rand(0.06, 0.14) * (CFG.boltJaggedness * 2);
                const depth = Math.floor(rand(5, 7));
                const pts = [new THREE.Vector3(sx, sy, 0)];
                fractalPath(sx, sy, ex, ey, depth, jag, pts);
                return pts;
            }

            function subdividePath(points, passes = 1) {
                let pts = points;
                for (let p = 0; p < passes; p++) {
                    const next = [pts[0]];
                    for (let i = 0; i < pts.length - 1; i++) {
                        const a = pts[i],
                            b = pts[i + 1];
                        next.push(
                            new THREE.Vector3(
                                (a.x + b.x) / 2 + (Math.random() - 0.5) * 0.008,
                                (a.y + b.y) / 2 + (Math.random() - 0.5) * 0.005,
                                0,
                            ),
                            b,
                        );
                    }
                    pts = next;
                }
                return pts;
            }

            function makeLine(points, color, opacity, z = 0) {
                const geo = new THREE.BufferGeometry().setFromPoints(points);
                const mat = new THREE.LineBasicMaterial({
                    color,
                    transparent: true,
                    opacity,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    depthTest: false,
                });
                const line = new THREE.Line(geo, mat);
                line.position.z = z;
                lightningGroup.add(line);
                return line;
            }

            function makeMultiLayerBolt(points) {
                const smooth = subdividePath(points, 1),
                    layers = [];
                const oP = smooth.map(
                    (p) =>
                        new THREE.Vector3(
                            p.x + (Math.random() - 0.5) * 0.006,
                            p.y + (Math.random() - 0.5) * 0.004,
                            0,
                        ),
                );
                layers.push(makeLine(oP, COL.outer, 0.05, -0.04));
                const mP = smooth.map(
                    (p) =>
                        new THREE.Vector3(
                            p.x + (Math.random() - 0.5) * 0.003,
                            p.y + (Math.random() - 0.5) * 0.002,
                            0,
                        ),
                );
                layers.push(makeLine(mP, COL.mid, 0.14, -0.03));
                layers.push(makeLine(smooth, COL.inner, 0.38, -0.01));
                layers.push(makeLine(smooth, COL.core, 0.72, 0));
                const c2 = smooth.map(
                    (p) =>
                        new THREE.Vector3(
                            p.x + (Math.random() - 0.5) * 0.002,
                            p.y + (Math.random() - 0.5) * 0.001,
                            0,
                        ),
                );
                layers.push(makeLine(c2, COL.core, 0.4, 0.001));
                return layers;
            }

            function createBranches(parentPoints, depth = 0) {
                if (!CFG.branchEnabled || depth > 2 || parentPoints.length < 5)
                    return [];
                const bd = [];
                const nb = Math.floor(rand(1, 3 - depth));
                for (let b = 0; b < nb; b++) {
                    const idx = Math.floor(rand(2, parentPoints.length - 2));
                    const origin = parentPoints[idx],
                        dir = Math.random() > 0.5 ? 1 : -1;
                    const segs = Math.floor(rand(3, 7 - depth)),
                        pts = [origin.clone()];
                    for (let i = 1; i <= segs; i++) {
                        const prev = pts[i - 1];
                        pts.push(
                            new THREE.Vector3(
                                prev.x +
                                    rand(0.02, 0.055) * dir +
                                    (Math.random() - 0.5) * 0.015,
                                prev.y - rand(0.015, 0.05),
                                0,
                            ),
                        );
                    }
                    const smooth = subdividePath(pts, 1),
                        layers = [],
                        fs = 1 / (depth + 1);
                    layers.push(makeLine(smooth, COL.outer, 0.06 * fs, -0.03));
                    layers.push(makeLine(smooth, COL.branch, 0.35 * fs, -0.01));
                    layers.push(makeLine(smooth, COL.core, 0.65 * fs, 0));
                    bd.push({ layers });
                    if (Math.random() > 0.5 && depth < 2)
                        createBranches(pts, depth + 1).forEach((sb) =>
                            bd.push(sb),
                        );
                }
                return bd;
            }

            /* ── Crawl shaders ── */
            const crawlVS = `varying vec2 vUv; void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`;
            const crawlFS = `varying vec2 vUv;uniform float uOpacity;uniform vec3 uColor;uniform float uAspect;
      void main(){vec2 c=vUv-0.5;c.x*=uAspect;float d=length(c)*2.0;if(d>1.8)discard;float g=exp(-d*d*8.0)*uOpacity;if(g<0.002)discard;gl_FragColor=vec4(uColor,g);}`;

            let currentAspect = window.innerWidth / window.innerHeight;

            function createCrawlPoints(path) {
                if (!CFG.crawlEnabled) return [];
                const crawls = [],
                    nc = Math.floor(rand(1, 3));
                for (let i = 0; i < nc; i++) {
                    const geo = new THREE.PlaneGeometry(
                        0.06,
                        0.06 * currentAspect,
                    );
                    const mat = new THREE.ShaderMaterial({
                        transparent: true,
                        depthWrite: false,
                        depthTest: false,
                        blending: THREE.AdditiveBlending,
                        uniforms: {
                            uOpacity: { value: 0 },
                            uColor: { value: COL.crawl.clone() },
                            uAspect: { value: 1.0 },
                        },
                        vertexShader: crawlVS,
                        fragmentShader: crawlFS,
                    });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.z = 0.01;
                    lightningGroup.add(mesh);
                    const hGeo = new THREE.PlaneGeometry(
                        0.16,
                        0.16 * currentAspect,
                    );
                    const hMat = new THREE.ShaderMaterial({
                        transparent: true,
                        depthWrite: false,
                        depthTest: false,
                        blending: THREE.AdditiveBlending,
                        uniforms: {
                            uOpacity: { value: 0 },
                            uColor: { value: COL.inner.clone() },
                            uAspect: { value: 1.0 },
                        },
                        vertexShader: crawlVS,
                        fragmentShader: crawlFS,
                    });
                    const halo = new THREE.Mesh(hGeo, hMat);
                    halo.position.z = 0.005;
                    lightningGroup.add(halo);
                    crawls.push({
                        mesh,
                        halo,
                        path,
                        progress: rand(-0.1, 0.1),
                        speed: rand(1.8, 4.5),
                        delay: rand(0, 0.15) * i,
                        maxOpacity: rand(0.7, 1.0),
                        haloMax: rand(0.15, 0.35),
                    });
                }
                return crawls;
            }

            /* ── Flash shaders ── */
            const flashVS = crawlVS;
            const flashFS = `uniform float uOpacity;uniform vec3 uColor;uniform float uSoftness;uniform float uAspect;varying vec2 vUv;
      void main(){vec2 c=vUv-0.5;c.x*=uAspect;float d=length(c)*2.0;if(d>1.8)discard;float a=(exp(-d*d*uSoftness*2.0)+exp(-d*d*uSoftness*0.5)*0.25)*uOpacity;if(a<0.002)discard;gl_FragColor=vec4(uColor,a);}`;

            const flashBursts = [];

            function spawnFlash(x, y, scale) {
                if (!CFG.flashEnabled) return;
                const size = rand(0.25, 0.5) * scale,
                    asp = currentAspect,
                    fb = CFG.flashBrightness;
                const coreGeo = new THREE.PlaneGeometry(size, size * asp);
                const coreMat = new THREE.ShaderMaterial({
                    transparent: true,
                    depthWrite: false,
                    depthTest: false,
                    blending: THREE.AdditiveBlending,
                    uniforms: {
                        uOpacity: { value: fb },
                        uColor: { value: COL.core.clone() },
                        uSoftness: { value: rand(4, 6.5) },
                        uAspect: { value: 1.0 },
                    },
                    vertexShader: flashVS,
                    fragmentShader: flashFS,
                });
                const core = new THREE.Mesh(coreGeo, coreMat);
                core.position.set(x, y, -0.05);
                lightningGroup.add(core);
                const hs = size * rand(3, 5);
                const haloGeo = new THREE.PlaneGeometry(hs, hs * asp);
                const haloMat = new THREE.ShaderMaterial({
                    transparent: true,
                    depthWrite: false,
                    depthTest: false,
                    blending: THREE.AdditiveBlending,
                    uniforms: {
                        uOpacity: { value: fb * 0.35 },
                        uColor: { value: COL.mid.clone() },
                        uSoftness: { value: rand(2.5, 4) },
                        uAspect: { value: 1.0 },
                    },
                    vertexShader: flashVS,
                    fragmentShader: flashFS,
                });
                const halo = new THREE.Mesh(haloGeo, haloMat);
                halo.position.set(x, y, -0.06);
                lightningGroup.add(halo);
                flashBursts.push({
                    core,
                    halo,
                    age: 0,
                    life: rand(0.2, 0.5),
                    expandSpeed: rand(1.2, 2.2),
                    baseFB: fb,
                });

                const gc = CFG.lightningGlowColor;
                ambientEl.style.opacity = rand(0.15, 0.4) * fb;
                ambientEl.style.background = `radial-gradient(ellipse at ${(x + 1) * 50}% ${(1 - y) * 50}%, rgba(${Math.round(gc[0] * 255)},${Math.round(gc[1] * 255)},${Math.round(gc[2] * 255)},0.18), transparent 55%)`;
            }

            function disposeLine(l) {
                lightningGroup.remove(l);
                l.geometry.dispose();
                l.material.dispose();
            }
            function disposeMesh(m) {
                lightningGroup.remove(m);
                m.geometry.dispose();
                m.material.dispose();
            }

            const bolts = [];

            function spawnBolt() {
                if (!CFG.lightningEnabled) return;
                const zone = weightedZone(),
                    path = createPath(zone);
                const layers = makeMultiLayerBolt(path);
                const branches = createBranches(path);
                const crawls = createCrawlPoints(path);
                const bolt = {
                    layers,
                    branches,
                    crawls,
                    age: 0,
                    life: rand(CFG.boltLifeMin, CFG.boltLifeMax),
                    pulseSpeed: rand(28, 55),
                    flickerPhase: rand(0, Math.PI * 2),
                    zone,
                    path,
                };
                bolts.push(bolt);
                if (Math.random() > 0.3)
                    spawnFlash(path[0].x, path[0].y, zone.sc);
                if (Math.random() > 0.7) {
                    const e = path[path.length - 1];
                    spawnFlash(e.x, e.y, zone.sc * 0.6);
                }
                glowQuadMat.uniforms.uFlashCenter.value.set(
                    path[0].x,
                    path[0].y,
                );
                glowQuadMat.uniforms.uFlashIntensity.value = Math.max(
                    glowQuadMat.uniforms.uFlashIntensity.value,
                    rand(0.06, 0.18) * zone.sc,
                );
            }

            /* ── Resize ── */
            function resize() {
                const w = canvas.clientWidth || window.innerWidth,
                    h = canvas.clientHeight || window.innerHeight;
                renderer.setSize(w, h, false);
                camera.updateProjectionMatrix();
                currentAspect = w / h;
                glowQuadMat.uniforms.uAspect.value = currentAspect;
            }
            resize();
            window.addEventListener("resize", resize);

            /* ── Main loop ── */
            let lastTime = performance.now(),
                spawnTimer = 0,
                ambientDecay = 0;
            const wallpaperEl = document.getElementById("wallpaper");
            let shakeAmt = 0,
                shakeDec = 0,
                shakeTimer = rand(3, 7);

            function triggerShake(intensity) {
                shakeAmt = intensity * CFG.shakeIntensity * 4;
                shakeDec = 0;
            }

            function animate(now) {
                const dt = Math.min((now - lastTime) / 1000, 0.05);
                lastTime = now;
                spawnTimer -= dt;
                shakeTimer -= dt;

                if (CFG.lightningEnabled && spawnTimer <= 0) {
                    const bc =
                        Math.random() < CFG.burstChance
                            ? Math.floor(rand(2, 3))
                            : 1;
                    for (let i = 0; i < bc; i++) spawnBolt();
                    if (bc > 1 && CFG.shakeEnabled)
                        triggerShake(rand(0.5, 1.0));
                    spawnTimer = rand(CFG.spawnMin, CFG.spawnMax);
                }

                if (CFG.shakeEnabled && shakeTimer <= 0) {
                    triggerShake(rand(0.4, 1.0));
                    shakeTimer = rand(
                        CFG.shakeIntervalMin,
                        CFG.shakeIntervalMax,
                    );
                }

                if (shakeAmt > 0.01) {
                    shakeDec += dt;
                    const t = shakeDec / 0.45,
                        env = Math.max(0, 1 - t * t),
                        freq = 28;
                    const ox = Math.sin(shakeDec * freq) * shakeAmt * env * 1.2;
                    const oy =
                        Math.cos(shakeDec * freq * 1.3 + 0.7) *
                        shakeAmt *
                        env *
                        0.8;
                    wallpaperEl.style.transform = `scale(1.03) translate3d(${ox}px,${oy}px,0)`;
                    if (env <= 0) {
                        shakeAmt = 0;
                        wallpaperEl.style.transform = "";
                    }
                }

                for (let i = bolts.length - 1; i >= 0; i--) {
                    const b = bolts[i];
                    b.age += dt;
                    const t = b.age / b.life;
                    const flk =
                        0.65 +
                        Math.sin(b.age * b.pulseSpeed + b.flickerPhase) * 0.22 +
                        Math.sin(
                            b.age * b.pulseSpeed * 2.7 + b.flickerPhase * 1.3,
                        ) *
                            0.13;
                    const env =
                        t < 0.08
                            ? t / 0.08
                            : Math.max(0, 1 - (t - 0.08) / 0.92);
                    const fade = env * flk;
                    const ops = [0.05, 0.14, 0.38, 0.72, 0.4];
                    b.layers.forEach((l, li) => {
                        l.material.opacity = ops[li] * fade;
                    });
                    b.branches.forEach((br) => {
                        br.layers.forEach((l) => {
                            l.material.opacity *= fade;
                        });
                    });
                    b.crawls.forEach((c) => {
                        c.progress += c.speed * dt;
                        const cp = Math.max(
                            0,
                            Math.min(c.progress - c.delay, 1),
                        );
                        if (cp <= 0 || cp >= 1) {
                            c.mesh.material.uniforms.uOpacity.value = 0;
                            c.halo.material.uniforms.uOpacity.value = 0;
                            return;
                        }
                        const idx = Math.floor(cp * (c.path.length - 1)),
                            ni = Math.min(idx + 1, c.path.length - 1),
                            lt = cp * (c.path.length - 1) - idx;
                        const px = THREE.MathUtils.lerp(
                                c.path[idx].x,
                                c.path[ni].x,
                                lt,
                            ),
                            py = THREE.MathUtils.lerp(
                                c.path[idx].y,
                                c.path[ni].y,
                                lt,
                            );
                        c.mesh.position.set(px, py, c.mesh.position.z);
                        c.halo.position.set(px, py, c.halo.position.z);
                        const cf = Math.sin(cp * Math.PI);
                        c.mesh.material.uniforms.uOpacity.value =
                            c.maxOpacity * cf * fade;
                        c.halo.material.uniforms.uOpacity.value =
                            c.haloMax * cf * fade;
                        c.halo.scale.setScalar(1 + cf * 0.6);
                    });
                    if (t >= 1) {
                        b.layers.forEach(disposeLine);
                        b.branches.forEach((br) =>
                            br.layers.forEach(disposeLine),
                        );
                        b.crawls.forEach((c) => {
                            disposeMesh(c.mesh);
                            disposeMesh(c.halo);
                        });
                        bolts.splice(i, 1);
                    }
                }

                for (let i = flashBursts.length - 1; i >= 0; i--) {
                    const f = flashBursts[i];
                    f.age += dt;
                    const t = f.age / f.life;
                    const fo = Math.max(0, 1 - t * t * t);
                    f.core.scale.setScalar(1 + t * f.expandSpeed * 0.6);
                    f.core.material.uniforms.uOpacity.value = f.baseFB * fo;
                    f.halo.scale.setScalar(1 + t * f.expandSpeed);
                    f.halo.material.uniforms.uOpacity.value =
                        f.baseFB * 0.35 * fo;
                    if (t >= 1) {
                        disposeMesh(f.core);
                        disposeMesh(f.halo);
                        flashBursts.splice(i, 1);
                    }
                }

                const gi = glowQuadMat.uniforms.uFlashIntensity;
                gi.value = Math.max(0, gi.value - dt * 1.2);

                ambientDecay += dt;
                if (ambientDecay > 0.12) {
                    const curr = parseFloat(ambientEl.style.opacity) || 0;
                    ambientEl.style.opacity = Math.max(0, curr - dt * 2);
                    if (curr <= 0) ambientDecay = 0;
                }

                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate);

            /* ── Water ripple overlay ── */
            const rctx = rippleCanvas.getContext("2d");

            function resizeRipple() {
                const s = 0.25;
                rippleCanvas.width = Math.floor(window.innerWidth * s);
                rippleCanvas.height = Math.floor(window.innerHeight * s);
            }
            resizeRipple();
            window.addEventListener("resize", resizeRipple);

            function drawRipples(time) {
                if (!CFG.rippleEnabled) {
                    requestAnimationFrame(drawRipples);
                    return;
                }
                const w = rippleCanvas.width,
                    h = rippleCanvas.height,
                    t = time * 0.001 * CFG.rippleSpeed;
                const img = rctx.createImageData(w, h),
                    d = img.data;
                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const nx = x / w,
                            ny = y / h;
                        const w1 =
                            Math.sin(
                                nx * 6 +
                                    t * 0.4 +
                                    Math.sin(ny * 4 + t * 0.3) * 1.2,
                            ) *
                            Math.cos(
                                ny * 5 -
                                    t * 0.35 +
                                    Math.sin(nx * 3.5 + t * 0.25) * 0.9,
                            );
                        const w2 =
                            Math.sin(nx * 12 - t * 0.55 + ny * 8) *
                            Math.cos(ny * 10 + t * 0.45 - nx * 6) *
                            0.5;
                        const w3 =
                            Math.sin(
                                nx * 22 +
                                    t * 0.7 +
                                    Math.cos(ny * 18 - t * 0.5) * 1.5,
                            ) *
                            Math.cos(
                                ny * 20 -
                                    t * 0.6 +
                                    Math.sin(nx * 16 + t * 0.4) * 1.2,
                            ) *
                            0.25;
                        const br = Math.floor((w1 + w2 + w3) * 0.5 * 255 + 128);
                        const idx = (y * w + x) * 4;
                        d[idx] = Math.floor(br * 0.75);
                        d[idx + 1] = Math.floor(br * 0.92);
                        d[idx + 2] = br;
                        d[idx + 3] = 255;
                    }
                }
                rctx.putImageData(img, 0, 0);
                requestAnimationFrame(drawRipples);
            }
            requestAnimationFrame(drawRipples);

            /* ── Initial CSS apply ── */
            applyCSS();
        </script>
    </body>
</html>
