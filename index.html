<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Abyssal Lagiacrus Wallpaper</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Electrolize&display=swap");

            :root {
                --bg-image: url("abyssal-lagricus.png");
                --cyan: 111, 232, 255;
                --blue: 42, 147, 255;
                --white: 220, 247, 255;
                --glass: rgba(3, 16, 27, 0.28);
                --text: rgba(235, 249, 255, 0.96);
                --text-soft: rgba(214, 236, 246, 0.78);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #03111d;
                font-family: "Electrolize", system-ui, sans-serif;
            }

            body {
                position: relative;
                color: var(--text);
                user-select: none;
            }

            .wallpaper {
                position: relative;
                width: 100vw;
                height: 100vh;
                overflow: hidden;
                isolation: isolate;
                background:
                    radial-gradient(
                        circle at 20% 18%,
                        rgba(115, 223, 255, 0.16),
                        transparent 32%
                    ),
                    radial-gradient(
                        circle at 78% 26%,
                        rgba(58, 130, 255, 0.15),
                        transparent 30%
                    ),
                    radial-gradient(
                        circle at 55% 75%,
                        rgba(6, 44, 77, 0.55),
                        transparent 40%
                    ),
                    linear-gradient(
                        180deg,
                        rgba(2, 18, 31, 0.12),
                        rgba(0, 10, 20, 0.64)
                    ),
                    var(--bg-image) center center / cover no-repeat;
                transform: scale(1.03);
                animation: slowDrift 28s ease-in-out infinite alternate;
            }

            .wallpaper::before,
            .wallpaper::after {
                content: "";
                position: absolute;
                inset: -8%;
                pointer-events: none;
                z-index: 0;
            }

            .wallpaper::before {
                background:
                    radial-gradient(
                        circle at 20% 10%,
                        rgba(166, 240, 255, 0.18),
                        transparent 24%
                    ),
                    radial-gradient(
                        circle at 80% 12%,
                        rgba(85, 173, 255, 0.12),
                        transparent 26%
                    ),
                    linear-gradient(
                        180deg,
                        rgba(150, 225, 255, 0.1),
                        transparent 28%,
                        rgba(0, 0, 0, 0.22) 100%
                    );
                mix-blend-mode: screen;
                filter: blur(8px);
                animation: causticBreath 12s ease-in-out infinite;
            }

            .wallpaper::after {
                background:
                    radial-gradient(
                        circle at center,
                        transparent 38%,
                        rgba(0, 4, 10, 0.18) 68%,
                        rgba(0, 3, 8, 0.78) 100%
                    ),
                    repeating-radial-gradient(
                        circle at 50% 50%,
                        rgba(255, 255, 255, 0.012) 0 1px,
                        transparent 1px 6px
                    );
                opacity: 0.95;
                z-index: 9;
            }

            .depth-haze,
            .water-rays,
            .mist,
            .vignette,
            .grain {
                position: absolute;
                inset: 0;
                pointer-events: none;
            }

            .depth-haze {
                z-index: 1;
                background:
                    linear-gradient(
                        180deg,
                        rgba(72, 170, 216, 0.1),
                        rgba(3, 20, 34, 0.05) 38%,
                        rgba(0, 8, 16, 0.36) 100%
                    ),
                    radial-gradient(
                        circle at 50% 44%,
                        transparent 8%,
                        rgba(0, 31, 54, 0.18) 58%,
                        rgba(0, 5, 12, 0.58) 100%
                    );
                backdrop-filter: blur(0.4px);
            }

            .water-rays {
                z-index: 2;
                opacity: 0.58;
                mix-blend-mode: screen;
                background:
                    linear-gradient(
                        116deg,
                        transparent 10%,
                        rgba(166, 239, 255, 0.12) 28%,
                        transparent 41%
                    ),
                    linear-gradient(
                        102deg,
                        transparent 24%,
                        rgba(112, 208, 255, 0.09) 40%,
                        transparent 55%
                    ),
                    linear-gradient(
                        84deg,
                        transparent 36%,
                        rgba(106, 211, 255, 0.08) 48%,
                        transparent 62%
                    );
                transform-origin: top center;
                animation: raysMove 16s ease-in-out infinite alternate;
            }

            .mist {
                z-index: 3;
                opacity: 0.48;
                filter: blur(26px);
                background:
                    radial-gradient(
                        circle at 22% 68%,
                        rgba(79, 188, 229, 0.18),
                        transparent 24%
                    ),
                    radial-gradient(
                        circle at 67% 42%,
                        rgba(43, 146, 255, 0.14),
                        transparent 22%
                    ),
                    radial-gradient(
                        circle at 82% 82%,
                        rgba(104, 221, 255, 0.12),
                        transparent 26%
                    );
                animation: mistFloat 20s ease-in-out infinite alternate;
            }

            .vignette {
                z-index: 10;
                background: radial-gradient(
                    circle at 52% 44%,
                    transparent 25%,
                    rgba(0, 6, 14, 0.28) 70%,
                    rgba(0, 4, 10, 0.78) 100%
                );
            }

            .grain {
                z-index: 11;
                opacity: 0.07;
                mix-blend-mode: soft-light;
                background-image:
                    radial-gradient(
                        rgba(255, 255, 255, 0.85) 0.7px,
                        transparent 0.9px
                    ),
                    radial-gradient(
                        rgba(255, 255, 255, 0.55) 0.6px,
                        transparent 0.8px
                    );
                background-size:
                    5px 5px,
                    7px 7px;
                background-position:
                    0 0,
                    2px 3px;
                animation: grainShift 0.18s steps(2) infinite;
            }

            .particles,
            .bubbles,
            .micro-glow {
                position: absolute;
                inset: 0;
                pointer-events: none;
                overflow: hidden;
            }

            .particles {
                z-index: 4;
            }

            .particle {
                position: absolute;
                width: var(--size);
                height: var(--size);
                border-radius: 50%;
                background: rgba(var(--white), var(--alpha));
                box-shadow:
                    0 0 10px rgba(var(--cyan), calc(var(--alpha) * 0.65)),
                    0 0 20px rgba(var(--blue), calc(var(--alpha) * 0.35));
                filter: blur(0.2px);
                animation: particleDrift var(--duration) linear infinite;
                animation-delay: var(--delay);
                opacity: 0;
            }

            .bubbles {
                z-index: 5;
            }

            .bubble {
                position: absolute;
                bottom: -12vh;
                width: var(--size);
                height: var(--size);
                border-radius: 50%;
                border: 1px solid rgba(214, 246, 255, 0.34);
                background:
                    radial-gradient(
                        circle at 28% 26%,
                        rgba(255, 255, 255, 0.68),
                        rgba(255, 255, 255, 0.11) 16%,
                        transparent 35%
                    ),
                    radial-gradient(
                        circle at 50% 55%,
                        rgba(131, 226, 255, 0.15),
                        transparent 72%
                    );
                box-shadow:
                    inset -2px -2px 8px rgba(255, 255, 255, 0.08),
                    0 0 16px rgba(var(--cyan), 0.1);
                opacity: 0;
                filter: blur(var(--blur));
                animation: bubbleRise var(--duration) ease-in infinite;
                animation-delay: var(--delay);
            }

            .micro-glow {
                z-index: 6;
                mix-blend-mode: screen;
                background:
                    radial-gradient(
                        circle at 39% 34%,
                        rgba(91, 224, 255, 0.2),
                        transparent 10%
                    ),
                    radial-gradient(
                        circle at 57% 44%,
                        rgba(23, 153, 255, 0.12),
                        transparent 12%
                    ),
                    radial-gradient(
                        circle at 48% 58%,
                        rgba(97, 234, 255, 0.09),
                        transparent 11%
                    );
                animation: glowPulse 5.5s ease-in-out infinite;
            }

            .three-lightning {
                position: absolute;
                inset: 0;
                z-index: 7;
                width: 100%;
                height: 100%;
                pointer-events: none;
                mix-blend-mode: screen;
                opacity: 0.62;
            }

            /* Fullscreen water caustic/ripple overlay */
            .water-ripple-canvas {
                position: absolute;
                inset: 0;
                z-index: 13;
                width: 100%;
                height: 100%;
                pointer-events: none;
                mix-blend-mode: overlay;
                opacity: 0.13;
            }

            /* Ambient glow layer that reacts to lightning flashes */
            .lightning-ambient {
                position: absolute;
                inset: 0;
                z-index: 6;
                pointer-events: none;
                mix-blend-mode: screen;
                opacity: 0;
                transition: opacity 0.05s ease-out;
                background: radial-gradient(
                    ellipse at 50% 40%,
                    rgba(60, 140, 255, 0.12),
                    transparent 60%
                );
            }

            .clock-panel {
                position: absolute;
                left: clamp(48px, 12vw, 200px);
                bottom: clamp(60px, 10vh, 140px);
                z-index: 12;
                padding: 0;
                border: none;
                border-radius: 0;
                background: none;
                box-shadow: none;
                backdrop-filter: none;
            }

            .clock {
                font-family: "Orbitron", monospace, sans-serif;
                font-size: clamp(54px, 8.5vw, 138px);
                line-height: 0.95;
                font-weight: 800;
                letter-spacing: 0.02em;
                color: rgba(200, 225, 255, 0.95);
                text-shadow:
                    0 0 8px rgba(80, 160, 255, 0.6),
                    0 0 24px rgba(60, 130, 255, 0.35),
                    0 0 60px rgba(40, 100, 255, 0.15),
                    0 4px 20px rgba(0, 0, 0, 0.5);
            }

            .date {
                margin-top: 8px;
                font-family: "Electrolize", system-ui, sans-serif;
                font-size: clamp(13px, 1.3vw, 20px);
                font-weight: 400;
                letter-spacing: 0.28em;
                text-transform: uppercase;
                color: rgba(140, 185, 255, 0.7);
                text-shadow:
                    0 0 12px rgba(60, 130, 255, 0.3),
                    0 2px 10px rgba(0, 0, 0, 0.4);
            }

            .clock-accent {
                position: relative;
                left: 0;
                top: 0;
                width: 48px;
                height: 2px;
                margin-bottom: 12px;
                border-radius: 999px;
                background: linear-gradient(
                    90deg,
                    rgba(80, 160, 255, 0.9),
                    rgba(40, 100, 255, 0.05)
                );
                box-shadow: 0 0 14px rgba(80, 160, 255, 0.5);
            }

            @keyframes slowDrift {
                0% {
                    transform: scale(1.03) translate3d(0, 0, 0);
                }
                100% {
                    transform: scale(1.07) translate3d(-0.7vw, -0.5vh, 0);
                }
            }
            @keyframes causticBreath {
                0%,
                100% {
                    opacity: 0.82;
                    transform: scale(1) translate3d(0, 0, 0);
                }
                50% {
                    opacity: 1;
                    transform: scale(1.04) translate3d(0.8vw, -0.4vh, 0);
                }
            }
            @keyframes raysMove {
                0% {
                    transform: translateX(-1vw) skewX(-3deg);
                    opacity: 0.4;
                }
                100% {
                    transform: translateX(2vw) skewX(2deg);
                    opacity: 0.68;
                }
            }
            @keyframes mistFloat {
                0% {
                    transform: translate3d(-1vw, 0.8vh, 0) scale(1);
                }
                100% {
                    transform: translate3d(1.5vw, -1vh, 0) scale(1.06);
                }
            }
            @keyframes glowPulse {
                0%,
                100% {
                    opacity: 0.65;
                    transform: scale(1);
                }
                50% {
                    opacity: 1;
                    transform: scale(1.02);
                }
            }
            @keyframes particleDrift {
                0% {
                    transform: translate3d(0, 14vh, 0) scale(0.8);
                    opacity: 0;
                }
                12% {
                    opacity: 0.85;
                }
                88% {
                    opacity: 0.5;
                }
                100% {
                    transform: translate3d(var(--drift), -118vh, 0) scale(1.15);
                    opacity: 0;
                }
            }
            @keyframes bubbleRise {
                0% {
                    transform: translate3d(0, 0, 0) scale(0.72);
                    opacity: 0;
                }
                8% {
                    opacity: 0.72;
                }
                84% {
                    opacity: 0.48;
                }
                100% {
                    transform: translate3d(var(--drift), -124vh, 0) scale(1.18);
                    opacity: 0;
                }
            }
            @keyframes grainShift {
                0% {
                    transform: translate(0, 0);
                }
                25% {
                    transform: translate(-1%, 1%);
                }
                50% {
                    transform: translate(1%, -1%);
                }
                75% {
                    transform: translate(0.5%, 1%);
                }
                100% {
                    transform: translate(0, 0);
                }
            }

            @media (max-width: 900px) {
                .clock-panel {
                    left: 24px;
                    bottom: 40px;
                }
            }
        </style>
    </head>
    <body>
        <main class="wallpaper" id="wallpaper">
            <div class="depth-haze"></div>
            <div class="water-rays"></div>
            <div class="mist"></div>
            <div class="particles" id="particles"></div>
            <div class="bubbles" id="bubbles"></div>
            <div class="micro-glow"></div>
            <div class="lightning-ambient" id="lightningAmbient"></div>
            <canvas
                class="three-lightning"
                id="threeLightning"
                aria-hidden="true"
            ></canvas>
            <div class="vignette"></div>
            <div class="grain"></div>
            <canvas
                class="water-ripple-canvas"
                id="waterRipple"
                aria-hidden="true"
            ></canvas>

            <section class="clock-panel" aria-label="Clock and date">
                <span class="clock-accent"></span>
                <div class="clock" id="clock">00:00</div>
                <div class="date" id="date">MONDAY, JANUARY 01</div>
            </section>
        </main>

        <script type="module">
            import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

            /* ── DOM refs ── */
            const particlesRoot = document.getElementById("particles");
            const bubblesRoot = document.getElementById("bubbles");
            const canvas = document.getElementById("threeLightning");
            const clockEl = document.getElementById("clock");
            const dateEl = document.getElementById("date");
            const ambientEl = document.getElementById("lightningAmbient");

            const rand = (a, b) => Math.random() * (b - a) + a;

            /* ── Particles & Bubbles (unchanged) ── */
            function buildParticles(count = 90) {
                const f = document.createDocumentFragment();
                for (let i = 0; i < count; i++) {
                    const n = document.createElement("span");
                    n.className = "particle";
                    n.style.left = `${rand(0, 100).toFixed(2)}%`;
                    n.style.top = `${rand(0, 100).toFixed(2)}%`;
                    n.style.setProperty(
                        "--size",
                        `${rand(1, 4.5).toFixed(2)}px`,
                    );
                    n.style.setProperty(
                        "--duration",
                        `${rand(10, 26).toFixed(2)}s`,
                    );
                    n.style.setProperty(
                        "--delay",
                        `${rand(-26, 0).toFixed(2)}s`,
                    );
                    n.style.setProperty(
                        "--drift",
                        `${rand(-10, 10).toFixed(2)}vw`,
                    );
                    n.style.setProperty("--alpha", rand(0.18, 0.72).toFixed(2));
                    f.appendChild(n);
                }
                particlesRoot.appendChild(f);
            }

            function buildBubbles(count = 28) {
                const f = document.createDocumentFragment();
                for (let i = 0; i < count; i++) {
                    const n = document.createElement("span");
                    n.className = "bubble";
                    n.style.left = `${rand(0, 100).toFixed(2)}%`;
                    n.style.setProperty(
                        "--size",
                        `${rand(4, 20).toFixed(2)}px`,
                    );
                    n.style.setProperty(
                        "--duration",
                        `${rand(11, 25).toFixed(2)}s`,
                    );
                    n.style.setProperty(
                        "--delay",
                        `${rand(-25, 0).toFixed(2)}s`,
                    );
                    n.style.setProperty(
                        "--drift",
                        `${rand(-7, 7).toFixed(2)}vw`,
                    );
                    n.style.setProperty(
                        "--blur",
                        `${rand(0, 1.2).toFixed(2)}px`,
                    );
                    f.appendChild(n);
                }
                bubblesRoot.appendChild(f);
            }

            function updateTime() {
                const now = new Date();
                clockEl.textContent = now.toLocaleTimeString("en-US", {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: false,
                });
                dateEl.textContent = now
                    .toLocaleDateString("en-US", {
                        weekday: "long",
                        month: "long",
                        day: "2-digit",
                    })
                    .toUpperCase();
            }

            buildParticles();
            buildBubbles();
            updateTime();
            setInterval(updateTime, 1000);

            /* ══════════════════════════════════════════════════════
       ENHANCED LIGHTNING SYSTEM
       ══════════════════════════════════════════════════════ */

            const renderer = new THREE.WebGLRenderer({
                canvas,
                alpha: true,
                antialias: false,
                powerPreference: "high-performance",
            });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setClearColor(0x000000, 0);

            const scene = new THREE.Scene();
            const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
            camera.position.z = 2;

            const lightningGroup = new THREE.Group();
            scene.add(lightningGroup);

            /* ── Fullscreen glow quad (shader-based bloom) ── */
            const glowQuadGeo = new THREE.PlaneGeometry(2.4, 2.4);
            const glowQuadMat = new THREE.ShaderMaterial({
                transparent: true,
                depthWrite: false,
                depthTest: false,
                blending: THREE.AdditiveBlending,
                uniforms: {
                    uFlashIntensity: { value: 0 },
                    uFlashCenter: { value: new THREE.Vector2(0, 0) },
                    uFlashColor: { value: new THREE.Color(0.3, 0.65, 1.0) },
                    uAspect: { value: window.innerWidth / window.innerHeight },
                },
                vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
                fragmentShader: `
        uniform float uFlashIntensity;
        uniform vec2  uFlashCenter;
        uniform vec3  uFlashColor;
        uniform float uAspect;
        varying vec2  vUv;
        void main() {
          vec2 p = vUv * 2.0 - 1.0;
          vec2 diff = p - uFlashCenter;
          diff.x *= uAspect;
          float dist = length(diff);
          float glow = exp(-dist * dist * 3.5) * uFlashIntensity;
          float outer = exp(-dist * dist * 0.8) * uFlashIntensity * 0.2;
          float alpha = glow + outer;
          if (alpha < 0.002) discard;
          gl_FragColor = vec4(uFlashColor, alpha);
        }
      `,
            });
            const glowQuad = new THREE.Mesh(glowQuadGeo, glowQuadMat);
            glowQuad.position.z = -0.1;
            lightningGroup.add(glowQuad);

            /* ── Colors ── */
            const COL = {
                core: new THREE.Color(0xd0e8ff),
                inner: new THREE.Color(0x6aafff),
                mid: new THREE.Color(0x3b8def),
                outer: new THREE.Color(0x1a56b8),
                branch: new THREE.Color(0x5da0ff),
                crawl: new THREE.Color(0x4a98ff),
            };

            /* ── Bolt spawn zones — biased toward creature area ── */
            const ZONES = [
                { x: -0.5, y: 0.3, sx: 0.2, sy: 0.16, sc: 0.7, weight: 0.8 },
                { x: -0.18, y: 0.05, sx: 0.22, sy: 0.2, sc: 1.0, weight: 1.5 },
                { x: 0.12, y: 0.22, sx: 0.24, sy: 0.22, sc: 1.15, weight: 1.8 },
                { x: 0.38, y: -0.04, sx: 0.2, sy: 0.18, sc: 0.95, weight: 1.2 },
                { x: 0.58, y: 0.3, sx: 0.18, sy: 0.14, sc: 0.72, weight: 0.7 },
                { x: 0.0, y: -0.2, sx: 0.3, sy: 0.12, sc: 0.85, weight: 0.6 },
            ];

            function weightedZone() {
                const total = ZONES.reduce((s, z) => s + z.weight, 0);
                let r = Math.random() * total;
                for (const z of ZONES) {
                    r -= z.weight;
                    if (r <= 0) return z;
                }
                return ZONES[0];
            }

            /* ── Create jagged lightning path with midpoint displacement ── */
            function fractalPath(x0, y0, x1, y1, depth, jaggedness, points) {
                if (depth <= 0) {
                    points.push(new THREE.Vector3(x1, y1, 0));
                    return;
                }
                const mx = (x0 + x1) / 2 + (Math.random() - 0.5) * jaggedness;
                const my =
                    (y0 + y1) / 2 + (Math.random() - 0.5) * jaggedness * 0.6;
                fractalPath(
                    x0,
                    y0,
                    mx,
                    my,
                    depth - 1,
                    jaggedness * 0.58,
                    points,
                );
                fractalPath(
                    mx,
                    my,
                    x1,
                    y1,
                    depth - 1,
                    jaggedness * 0.58,
                    points,
                );
            }

            function createPath(zone) {
                const sx = zone.x + rand(-zone.sx, zone.sx);
                const sy = zone.y + rand(-zone.sy, zone.sy);
                const height = rand(0.22, 0.65) * zone.sc;
                const dir = Math.random() > 0.5 ? 1 : -1;
                const ex = sx + rand(0.04, 0.22) * dir;
                const ey = sy - height;
                const jaggedness = rand(0.06, 0.14);
                const depth = Math.floor(rand(5, 7));
                const pts = [new THREE.Vector3(sx, sy, 0)];
                fractalPath(sx, sy, ex, ey, depth, jaggedness, pts);
                return pts;
            }

            /* ── Subdivide path for smoother curves with micro-jitter ── */
            function subdividePath(points, passes = 1) {
                let pts = points;
                for (let p = 0; p < passes; p++) {
                    const next = [pts[0]];
                    for (let i = 0; i < pts.length - 1; i++) {
                        const a = pts[i],
                            b = pts[i + 1];
                        const mid = new THREE.Vector3(
                            (a.x + b.x) / 2 + (Math.random() - 0.5) * 0.008,
                            (a.y + b.y) / 2 + (Math.random() - 0.5) * 0.005,
                            0,
                        );
                        next.push(mid, b);
                    }
                    pts = next;
                }
                return pts;
            }

            /* ── Line creation with variable width emulated via multiple offset lines ── */
            function makeLine(points, color, opacity, z = 0) {
                const geo = new THREE.BufferGeometry().setFromPoints(points);
                const mat = new THREE.LineBasicMaterial({
                    color,
                    transparent: true,
                    opacity,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    depthTest: false,
                });
                const line = new THREE.Line(geo, mat);
                line.position.z = z;
                lightningGroup.add(line);
                return line;
            }

            /* ── Create a multi-layer bolt for thick glowing look ── */
            function makeMultiLayerBolt(points) {
                const smooth = subdividePath(points, 1);
                const layers = [];

                // Outer bloom (wide, faint)
                const outerPts = smooth.map(
                    (p) =>
                        new THREE.Vector3(
                            p.x + (Math.random() - 0.5) * 0.006,
                            p.y + (Math.random() - 0.5) * 0.004,
                            0,
                        ),
                );
                layers.push(makeLine(outerPts, COL.outer, 0.05, -0.04));

                // Mid glow
                const midPts = smooth.map(
                    (p) =>
                        new THREE.Vector3(
                            p.x + (Math.random() - 0.5) * 0.003,
                            p.y + (Math.random() - 0.5) * 0.002,
                            0,
                        ),
                );
                layers.push(makeLine(midPts, COL.mid, 0.14, -0.03));

                // Inner
                layers.push(makeLine(smooth, COL.inner, 0.38, -0.01));

                // Bright core
                layers.push(makeLine(smooth, COL.core, 0.72, 0));

                // Second core offset for thickness
                const corePts2 = smooth.map(
                    (p) =>
                        new THREE.Vector3(
                            p.x + (Math.random() - 0.5) * 0.002,
                            p.y + (Math.random() - 0.5) * 0.001,
                            0,
                        ),
                );
                layers.push(makeLine(corePts2, COL.core, 0.4, 0.001));

                return layers;
            }

            /* ── Branches: recursive with depth limit ── */
            function createBranches(parentPoints, depth = 0) {
                if (depth > 2 || parentPoints.length < 5) return [];
                const branchData = [];
                const numBranches = Math.floor(rand(1, 3 - depth));

                for (let b = 0; b < numBranches; b++) {
                    const idx = Math.floor(rand(2, parentPoints.length - 2));
                    const origin = parentPoints[idx];
                    const dir = Math.random() > 0.5 ? 1 : -1;
                    const segs = Math.floor(rand(3, 7 - depth));
                    const pts = [origin.clone()];

                    for (let i = 1; i <= segs; i++) {
                        const prev = pts[i - 1];
                        pts.push(
                            new THREE.Vector3(
                                prev.x +
                                    rand(0.02, 0.055) * dir +
                                    (Math.random() - 0.5) * 0.015,
                                prev.y - rand(0.015, 0.05),
                                0,
                            ),
                        );
                    }

                    const smooth = subdividePath(pts, 1);
                    const layers = [];

                    // Branch glow
                    const fadeScale = 1 / (depth + 1);
                    layers.push(
                        makeLine(smooth, COL.outer, 0.06 * fadeScale, -0.03),
                    );
                    layers.push(
                        makeLine(smooth, COL.branch, 0.35 * fadeScale, -0.01),
                    );
                    layers.push(
                        makeLine(smooth, COL.core, 0.65 * fadeScale, 0),
                    );

                    branchData.push({ layers });

                    // Sub-branches
                    if (Math.random() > 0.5 && depth < 2) {
                        const subBranches = createBranches(pts, depth + 1);
                        subBranches.forEach((sb) => branchData.push(sb));
                    }
                }

                return branchData;
            }

            /* ── "Energy crawl" — glowing point traveling along the bolt ── */
            const crawlGlowFS = `
      varying vec2 vUv;
      uniform float uOpacity;
      uniform vec3 uColor;
      uniform float uAspect;
      void main() {
        vec2 c = vUv - 0.5;
        c.x *= uAspect;
        float d = length(c) * 2.0;
        if (d > 1.8) discard;
        float g = exp(-d * d * 8.0) * uOpacity;
        if (g < 0.002) discard;
        gl_FragColor = vec4(uColor, g);
      }
    `;
            const crawlGlowVS = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

            // Shared aspect value updated on resize
            let currentAspect = window.innerWidth / window.innerHeight;

            function createCrawlPoints(path) {
                const crawls = [];
                const numCrawls = Math.floor(rand(1, 3));
                for (let i = 0; i < numCrawls; i++) {
                    const geo = new THREE.PlaneGeometry(
                        0.06,
                        0.06 * currentAspect,
                    );
                    const mat = new THREE.ShaderMaterial({
                        transparent: true,
                        depthWrite: false,
                        depthTest: false,
                        blending: THREE.AdditiveBlending,
                        uniforms: {
                            uOpacity: { value: 0 },
                            uColor: { value: new THREE.Color(0.29, 0.6, 1.0) },
                            uAspect: { value: 1.0 },
                        },
                        vertexShader: crawlGlowVS,
                        fragmentShader: crawlGlowFS,
                    });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.z = 0.01;
                    lightningGroup.add(mesh);

                    const hGeo = new THREE.PlaneGeometry(
                        0.16,
                        0.16 * currentAspect,
                    );
                    const hMat = new THREE.ShaderMaterial({
                        transparent: true,
                        depthWrite: false,
                        depthTest: false,
                        blending: THREE.AdditiveBlending,
                        uniforms: {
                            uOpacity: { value: 0 },
                            uColor: { value: new THREE.Color(0.4, 0.72, 1.0) },
                            uAspect: { value: 1.0 },
                        },
                        vertexShader: crawlGlowVS,
                        fragmentShader: crawlGlowFS,
                    });
                    const halo = new THREE.Mesh(hGeo, hMat);
                    halo.position.z = 0.005;
                    lightningGroup.add(halo);

                    crawls.push({
                        mesh,
                        halo,
                        path,
                        progress: rand(-0.1, 0.1),
                        speed: rand(1.8, 4.5),
                        delay: rand(0, 0.15) * i,
                        maxOpacity: rand(0.7, 1.0),
                        haloMax: rand(0.15, 0.35),
                    });
                }
                return crawls;
            }

            /* ── Flash bursts: shader-based soft gaussian glows ── */
            const flashBursts = [];

            // Shared shader material for soft flash glows
            const flashVertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;
            const flashFragmentShader = `
      uniform float uOpacity;
      uniform vec3  uColor;
      uniform float uSoftness;
      uniform float uAspect;
      varying vec2  vUv;
      void main() {
        vec2 center = vUv - 0.5;
        center.x *= uAspect;
        float dist = length(center) * 2.0;
        if (dist > 1.8) discard;
        float glow = exp(-dist * dist * uSoftness * 2.0);
        float outer = exp(-dist * dist * uSoftness * 0.5) * 0.25;
        float alpha = (glow + outer) * uOpacity;
        if (alpha < 0.002) discard;
        gl_FragColor = vec4(uColor, alpha);
      }
    `;

            function spawnFlash(x, y, scale) {
                const size = rand(0.25, 0.5) * scale;
                const asp = currentAspect;

                // Core soft glow — height scaled by aspect to keep circular
                const coreGeo = new THREE.PlaneGeometry(size, size * asp);
                const coreMat = new THREE.ShaderMaterial({
                    transparent: true,
                    depthWrite: false,
                    depthTest: false,
                    blending: THREE.AdditiveBlending,
                    uniforms: {
                        uOpacity: { value: 0.35 },
                        uColor: { value: new THREE.Color(0.78, 0.9, 1.0) },
                        uSoftness: { value: rand(4.0, 6.5) },
                        uAspect: { value: 1.0 },
                    },
                    vertexShader: flashVertexShader,
                    fragmentShader: flashFragmentShader,
                });
                const core = new THREE.Mesh(coreGeo, coreMat);
                core.position.set(x, y, -0.05);
                lightningGroup.add(core);

                // Outer wide halo
                const haloSize = size * rand(3.0, 5.0);
                const haloGeo = new THREE.PlaneGeometry(
                    haloSize,
                    haloSize * asp,
                );
                const haloMat = new THREE.ShaderMaterial({
                    transparent: true,
                    depthWrite: false,
                    depthTest: false,
                    blending: THREE.AdditiveBlending,
                    uniforms: {
                        uOpacity: { value: 0.12 },
                        uColor: { value: new THREE.Color(0.28, 0.58, 1.0) },
                        uSoftness: { value: rand(2.5, 4.0) },
                        uAspect: { value: 1.0 },
                    },
                    vertexShader: flashVertexShader,
                    fragmentShader: flashFragmentShader,
                });
                const halo = new THREE.Mesh(haloGeo, haloMat);
                halo.position.set(x, y, -0.06);
                lightningGroup.add(halo);

                flashBursts.push({
                    core,
                    halo,
                    age: 0,
                    life: rand(0.2, 0.5),
                    expandSpeed: rand(1.2, 2.2),
                });

                // Update ambient glow element
                ambientEl.style.opacity = rand(0.15, 0.4);
                ambientEl.style.background = `radial-gradient(ellipse at ${(x + 1) * 50}% ${(1 - y) * 50}%, rgba(60, 140, 255, 0.18), transparent 55%)`;
            }

            /* ── Dispose helpers ── */
            function disposeLine(l) {
                lightningGroup.remove(l);
                l.geometry.dispose();
                l.material.dispose();
            }
            function disposeMesh(m) {
                lightningGroup.remove(m);
                m.geometry.dispose();
                m.material.dispose();
            }

            /* ── Active bolts ── */
            const bolts = [];

            function spawnBolt() {
                const zone = weightedZone();
                const path = createPath(zone);
                const layers = makeMultiLayerBolt(path);
                const branches = createBranches(path);
                const crawls = createCrawlPoints(path);

                const bolt = {
                    layers,
                    branches,
                    crawls,
                    age: 0,
                    life: rand(0.18, 0.48),
                    pulseSpeed: rand(28, 55),
                    flickerPhase: rand(0, Math.PI * 2),
                    zone,
                    path,
                };

                bolts.push(bolt);

                // Flash at origin
                if (Math.random() > 0.3) {
                    spawnFlash(path[0].x, path[0].y, zone.sc);
                }

                // Occasional flash at terminus
                if (Math.random() > 0.7) {
                    const end = path[path.length - 1];
                    spawnFlash(end.x, end.y, zone.sc * 0.6);
                }

                // Update shader-based glow
                glowQuadMat.uniforms.uFlashCenter.value.set(
                    path[0].x,
                    path[0].y,
                );
                glowQuadMat.uniforms.uFlashIntensity.value = Math.max(
                    glowQuadMat.uniforms.uFlashIntensity.value,
                    rand(0.06, 0.18) * zone.sc,
                );
            }

            /* ── Resize ── */
            function resize() {
                const w = canvas.clientWidth || window.innerWidth;
                const h = canvas.clientHeight || window.innerHeight;
                renderer.setSize(w, h, false);
                camera.updateProjectionMatrix();
                currentAspect = w / h;
                glowQuadMat.uniforms.uAspect.value = currentAspect;
            }
            resize();
            window.addEventListener("resize", resize);

            /* ── Main loop ── */
            let lastTime = performance.now();
            let spawnTimer = 0;
            let ambientDecay = 0;

            // Screen shake state
            const wallpaperEl = document.getElementById("wallpaper");
            let shakeIntensity = 0;
            let shakeDecay = 0;
            let shakeTimer = rand(3, 7); // seconds until next shake

            function triggerShake(intensity) {
                shakeIntensity = intensity;
                shakeDecay = 0;
            }

            function animate(now) {
                const dt = Math.min((now - lastTime) / 1000, 0.05);
                lastTime = now;
                spawnTimer -= dt;
                shakeTimer -= dt;

                // Spawn logic — less frequent, with occasional bursts
                if (spawnTimer <= 0) {
                    const burstCount =
                        Math.random() > 0.85 ? Math.floor(rand(2, 3)) : 1;
                    for (let i = 0; i < burstCount; i++) spawnBolt();
                    if (burstCount > 1) triggerShake(rand(1.0, 2.5));
                    spawnTimer = rand(0.6, 1.8);
                }

                // Periodic shake — independent of bolts, feels like distant thunder
                if (shakeTimer <= 0) {
                    triggerShake(rand(0.8, 2.2));
                    shakeTimer = rand(4, 12);
                }

                // Update shake
                if (shakeIntensity > 0.01) {
                    shakeDecay += dt;
                    const shakeDuration = 0.45;
                    const t = shakeDecay / shakeDuration;
                    const envelope = Math.max(0, 1 - t * t); // quadratic decay
                    const freq = 28;
                    const ox =
                        Math.sin(shakeDecay * freq) *
                        shakeIntensity *
                        envelope *
                        1.2;
                    const oy =
                        Math.cos(shakeDecay * freq * 1.3 + 0.7) *
                        shakeIntensity *
                        envelope *
                        0.8;
                    wallpaperEl.style.transform = `scale(1.03) translate3d(${ox}px, ${oy}px, 0)`;
                    if (envelope <= 0) {
                        shakeIntensity = 0;
                        wallpaperEl.style.transform = "";
                    }
                }

                // Update bolts
                for (let i = bolts.length - 1; i >= 0; i--) {
                    const b = bolts[i];
                    b.age += dt;
                    const t = b.age / b.life;

                    // Flicker: combine two frequencies for organic feel
                    const flk1 = Math.sin(
                        b.age * b.pulseSpeed + b.flickerPhase,
                    );
                    const flk2 = Math.sin(
                        b.age * b.pulseSpeed * 2.7 + b.flickerPhase * 1.3,
                    );
                    const flicker = 0.65 + flk1 * 0.22 + flk2 * 0.13;

                    // Sharp attack, smooth decay
                    const envelope =
                        t < 0.08
                            ? t / 0.08
                            : Math.max(0, 1 - (t - 0.08) / 0.92);
                    const fade = envelope * flicker;

                    // Update main layers (increasing opacity per layer)
                    const opacities = [0.05, 0.14, 0.38, 0.72, 0.4];
                    b.layers.forEach((layer, li) => {
                        layer.material.opacity = opacities[li] * fade;
                    });

                    // Update branches
                    b.branches.forEach((br) => {
                        br.layers.forEach((l) => {
                            l.material.opacity *= fade;
                        });
                    });

                    // Update crawl points
                    b.crawls.forEach((c) => {
                        c.progress += c.speed * dt;
                        const cp = Math.max(
                            0,
                            Math.min(c.progress - c.delay, 1),
                        );
                        if (cp <= 0 || cp >= 1) {
                            c.mesh.material.uniforms.uOpacity.value = 0;
                            c.halo.material.uniforms.uOpacity.value = 0;
                            return;
                        }
                        const idx = Math.floor(cp * (c.path.length - 1));
                        const nextIdx = Math.min(idx + 1, c.path.length - 1);
                        const lerpT = cp * (c.path.length - 1) - idx;
                        const px = THREE.MathUtils.lerp(
                            c.path[idx].x,
                            c.path[nextIdx].x,
                            lerpT,
                        );
                        const py = THREE.MathUtils.lerp(
                            c.path[idx].y,
                            c.path[nextIdx].y,
                            lerpT,
                        );
                        c.mesh.position.set(px, py, c.mesh.position.z);
                        c.halo.position.set(px, py, c.halo.position.z);
                        const crawlFade = Math.sin(cp * Math.PI);
                        c.mesh.material.uniforms.uOpacity.value =
                            c.maxOpacity * crawlFade * fade;
                        c.halo.material.uniforms.uOpacity.value =
                            c.haloMax * crawlFade * fade;
                        c.halo.scale.setScalar(1 + crawlFade * 0.6);
                    });

                    // Cleanup
                    if (t >= 1) {
                        b.layers.forEach(disposeLine);
                        b.branches.forEach((br) =>
                            br.layers.forEach(disposeLine),
                        );
                        b.crawls.forEach((c) => {
                            disposeMesh(c.mesh);
                            disposeMesh(c.halo);
                        });
                        bolts.splice(i, 1);
                    }
                }

                // Update flash bursts
                for (let i = flashBursts.length - 1; i >= 0; i--) {
                    const f = flashBursts[i];
                    f.age += dt;
                    const t = f.age / f.life;
                    // Smooth cubic fade out
                    const fadeOut = Math.max(0, 1 - t * t * t);
                    f.core.scale.setScalar(1 + t * f.expandSpeed * 0.6);
                    f.core.material.uniforms.uOpacity.value = 0.35 * fadeOut;
                    f.halo.scale.setScalar(1 + t * f.expandSpeed);
                    f.halo.material.uniforms.uOpacity.value = 0.12 * fadeOut;
                    if (t >= 1) {
                        disposeMesh(f.core);
                        disposeMesh(f.halo);
                        flashBursts.splice(i, 1);
                    }
                }

                // Decay shader glow
                const gi = glowQuadMat.uniforms.uFlashIntensity;
                gi.value = Math.max(0, gi.value - dt * 1.2);

                // Decay ambient CSS glow
                ambientDecay += dt;
                if (ambientDecay > 0.12) {
                    const curr = parseFloat(ambientEl.style.opacity) || 0;
                    ambientEl.style.opacity = Math.max(0, curr - dt * 2);
                    if (curr <= 0) ambientDecay = 0;
                }

                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);

            /* ══════════════════════════════════════════════════════
       WATER RIPPLE / CAUSTIC OVERLAY (2D Canvas)
       Subtle animated wave distortion mask over the whole wallpaper
       ══════════════════════════════════════════════════════ */
            const rippleCanvas = document.getElementById("waterRipple");
            const rctx = rippleCanvas.getContext("2d");

            function resizeRipple() {
                // Low-res for performance + natural softness
                const scale = 0.25;
                rippleCanvas.width = Math.floor(window.innerWidth * scale);
                rippleCanvas.height = Math.floor(window.innerHeight * scale);
            }
            resizeRipple();
            window.addEventListener("resize", resizeRipple);

            function drawRipples(time) {
                const w = rippleCanvas.width;
                const h = rippleCanvas.height;
                const t = time * 0.001; // seconds

                const imageData = rctx.createImageData(w, h);
                const data = imageData.data;

                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const nx = x / w;
                        const ny = y / h;

                        // Layer 1: large slow waves
                        const wave1 =
                            Math.sin(
                                nx * 6.0 +
                                    t * 0.4 +
                                    Math.sin(ny * 4.0 + t * 0.3) * 1.2,
                            ) *
                            Math.cos(
                                ny * 5.0 -
                                    t * 0.35 +
                                    Math.sin(nx * 3.5 + t * 0.25) * 0.9,
                            );

                        // Layer 2: medium ripples
                        const wave2 =
                            Math.sin(nx * 12.0 - t * 0.55 + ny * 8.0) *
                            Math.cos(ny * 10.0 + t * 0.45 - nx * 6.0) *
                            0.5;

                        // Layer 3: fine detail caustics
                        const wave3 =
                            Math.sin(
                                nx * 22.0 +
                                    t * 0.7 +
                                    Math.cos(ny * 18.0 - t * 0.5) * 1.5,
                            ) *
                            Math.cos(
                                ny * 20.0 -
                                    t * 0.6 +
                                    Math.sin(nx * 16.0 + t * 0.4) * 1.2,
                            ) *
                            0.25;

                        // Combine — normalized to 0..1
                        const combined = (wave1 + wave2 + wave3) * 0.5 + 0.5;

                        // Slight blue-cyan tint for underwater feel
                        const brightness = Math.floor(combined * 255);
                        const idx = (y * w + x) * 4;
                        data[idx] = Math.floor(brightness * 0.75); // R — slightly less
                        data[idx + 1] = Math.floor(brightness * 0.92); // G
                        data[idx + 2] = brightness; // B — full
                        data[idx + 3] = 255;
                    }
                }

                rctx.putImageData(imageData, 0, 0);
                requestAnimationFrame(drawRipples);
            }

            requestAnimationFrame(drawRipples);
        </script>
    </body>
</html>
